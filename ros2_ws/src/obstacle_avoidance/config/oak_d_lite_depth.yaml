# depthai_ros_driver (v2.12.2) params for the forward OAK-D Lite.
#
# RGBD on USB3: colour 720P (MJPEG on the camera, decoded by the driver back
# to /oak/rgb/image_raw bgr8 1280x720) and stereo depth ALIGNED to the colour
# camera (/oak/stereo/image_raw, 16UC1 mm, 1280x720, same intrinsics as
# colour). No NN, no IMU (pitch comes from the FC IMU over MAVROS).
#
# Consumers and what they do with the bigger frames:
#   * banner_node / corridor_perception_node shrink colour to
#     rgb_process_width (640, avoidance.yaml) before detecting — their pixel
#     tunings (green_detect.py, floor boundary) were made at 640x360 — and
#     scale the camera_info intrinsics to match.
#   * corridor_stride_px is per 640 px of depth width: on 1280-wide aligned
#     depth the nodes sample every 8th pixel (160x90 points, as before).
#   * sector_builder reads fx/cx and the size from /oak/stereo/camera_info.
#     With i_align_depth: true the driver takes the depth size from the rgb
#     socket (stereo_param_handler.cpp), so camera_info matches the image —
#     the old stereo.i_width/i_height pins are not needed any more.
#
# Not in v2.12.2 (silently ignored, so left out): camera.i_tf_publish_rate,
# rgb.i_publish_isp. The rectified mono topics are
# left.i_left_rect_publish_topic / right.i_right_rect_publish_topic in this
# version, not stereo.i_publish_left_rect / i_publish_right_rect.
#
# The RGBD default pipeline uploads a mobilenet blob at startup; i_nn_type:
# none keeps it from doing so (a failed upload takes the container down).
#
# Started by mission_stage.launch.py (stage oak), or by hand:
#   ros2 launch depthai_ros_driver camera.launch.py \
#       params_file:=<share>/obstacle_avoidance/config/oak_d_lite_depth.yaml \
#       parent_frame:=base_link pointcloud.enable:=false rectify_rgb:=false use_gdb:=false
/oak:
  ros__parameters:
    camera:
      i_pipeline_type: RGBD        # stereo depth + colour
      i_nn_type: none              # no on-device neural network (see header)
      i_enable_imu: false          # pitch comes from the FC IMU over MAVROS
      i_enable_ir: false           # OAK-D Lite has no IR projector
      i_usb_speed: SUPER           # force USB3; fails loudly instead of silently dropping to USB2
      i_publish_tf_from_calibration: false   # TF from the URDF (parent_frame:=base_link)

    rgb:
      i_publish_topic: true
      i_fps: 15.0
      i_resolution: '720P'
      i_width: 1280                # aligned depth takes its size from these
      i_height: 720
      i_low_bandwidth: true        # on-camera MJPEG encoding -> less USB/CPU load
      i_low_bandwidth_quality: 50
      i_enable_preview: false      # small preview stream, not needed
      i_output_isp: false          # use the video output rather than full ISP

    left:
      i_publish_topic: false       # raw mono streams not needed with stereo depth
      i_left_rect_publish_topic: false
      i_resolution: '480P'         # OV7251 has no 400P/720P (they fall back to 480P
      i_fps: 15.0                  # with a WARN); key is case-sensitive: '480P'

    right:
      i_publish_topic: false
      i_right_rect_publish_topic: false
      i_resolution: '480P'
      i_fps: 15.0

    stereo:
      i_publish_topic: true        # depth output
      i_output_disparity: false    # metric depth, 16UC1 millimetres
      i_fps: 15.0
      i_subpixel: false            # big VPU and bandwidth saving (integer disparity:
                                   # coarser range steps at 3 m+)
      i_lr_check: true             # keep: improves depth quality cheaply
      i_extended_disp: false       # only needed for very close range
      i_depth_preset: HIGH_DENSITY
      i_align_depth: true          # align depth to RGB (needed for RGBD)
      i_publish_synced_rect_pair: false
      i_low_bandwidth: false       # keep depth lossless
      # Corridor obstacles are WHITE boards with a little print between BLACK
      # walls: little texture, so depth comes mostly from edges and print.
      i_stereo_conf_threshold: 230   # accept the weaker matches on faint print / edges
      i_enable_speckle_filter: true  # removes small noisy blobs
      i_depth_filter_size: 3         # a 5x5 median erases thin bands along board edges
