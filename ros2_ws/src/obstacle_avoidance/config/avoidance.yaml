# obstacle_avoidance — single source of truth for every node.
# No magic numbers live in node code; everything tunable is here.
# Applied to all nodes via the "/**" wildcard namespace.
/**:
  ros__parameters:
    # --- binning ---
    n_bins: 72
    bin_width_deg: 5.0

    # --- vertical band ---
    band_half_angle_deg: 3.0        # narrow: wider bands see the floor when pitched
    pitch_compensation: true
    # Fixed camera-to-FC mounting pitch bias (deg), subtracted from the IMU
    # pitch before computing v_horizon. The IMU lives in the FC, so any constant
    # camera-mount misalignment is a fixed bias in the horizon row. Calibrate
    # once with scripts/calibrate_camera_pitch.py (Gate 3C). Positive = camera
    # tilted DOWN relative to the FC.
    camera_pitch_offset_deg: 0.0

    # --- range gating ---
    range_min_m: 0.40               # OAK-D Lite ~0.35 m min (480P, 7.5 cm baseline)
    range_max_report_m: 6.0         # obstacles beyond this are not reported
    range_max_valid_m: 15.0         # used ONLY for coverage accounting, see 4.3

    # --- validity ---
    min_valid_px_fraction_per_bin: 0.15
    ground_reject_height_m: -0.40   # relative to camera, negative = below
    ceiling_reject_height_m: 0.80

    # --- rates ---
    publish_rate_hz: 10.0
    # sensor_live cutoff: no /avoidance/scan within this -> sensor_live False.
    # 0.40 s = 4 missed frames at 10 Hz, above normal Pi 5 ROS jitter (0.20 s
    # was 2 frames and false-tripped, costing a full recover-hold each time).
    depth_stale_timeout_s: 0.40
    # Builder's own scan watchdog. The guard asserts at startup that
    # depth_stale_timeout_s + 0.15 <= this (>= one 10 Hz frame of margin);
    # raised 0.50 -> 0.60 to satisfy it rather than lowering the guard.
    depth_watchdog_timeout_s: 0.60  # stop publishing LaserScan entirely

    # --- frames ---
    scan_frame_id: "oak_forward"    # must exist in the TF tree for RViz to render the scan

    # --- coverage guard (Stage 4) ---
    # Nothing in this package commands the vehicle. The guard asserts sensor
    # health as two Bools (sensor_live, coverage_ok); path_planner flies the
    # corridors from /corridor/perception (below).
    guard_rate_hz: 10.0
    coverage_min_valid: 0.40       # coverage below this -> coverage_ok False.
                                   # PLACEHOLDER until Gate 0D measures the real baseline outdoors.
    coverage_recover_hold_s: 1.0
    viz_margin_ring_m: 0.4         # matches AVOID_MARGIN

    # --- corridor perception (corridor_perception_node) ---
    # The corridor WIDTH is not configured — it differs per corridor and is
    # measured: walls are paired when width_min..max apart. Walls W/2 to each
    # side enter the ~70 deg HFOV only ~0.7 W ahead; the fit uses the wall
    # sections ahead of the vehicle.
    corridor_rate_hz: 5.0           # Pi 5: ~60 ms per fit at stride 4
    corridor_stride_px: 4           # per 640 px of depth width: 1280x720 aligned
                                    # OAK depth -> every 8th px, 160x90 samples
    rgb_process_width: 640          # colour shrunk to this before the RGB wall
                                    # bases / banner (their pixel tunings are at
                                    # 640x360; the OAK publishes 1280x720)
    corridor_width_min_m: 1.0
    corridor_width_max_m: 4.0       # wider: walls enter view too close to max range
    corridor_width_tol_m: 0.30      # NEW: once measured, pairs this near it only
    corridor_path_half_width_m: 0.42  # NEW: path_dist band = half drone width +
                                    # side clearance (0.305 + 0.10 at 0.61 m), no
                                    # wider: a lane passes obstacles that close
    corridor_width_window: 15       # width = median of the last N wall pairs
    corridor_width_forget_s: 5.0    # no wall fit this long -> width unknown again
    corridor_width_prior_m: 3.5052  # 11.5 ft: one wall gives a fit from the first
                                    # frame (both walls are rarely in view at once:
                                    # OAK-D bench 81 of ~2000 frames). 0 = none
    corridor_max_single_offset_m: 1.5  # one wall: inferred centre within this of
                                    # the nose (the planner's band is +-1.34 m)
    corridor_unfitted_margin_m: 0.60   # (= corridor_follow FollowParams.unfitted_margin_m)
                                    # no wall fit: obstacles looked for within
                                    # width/2 - this of the nose (< drone width +
                                    # 2 x side clearance = 0.83 m, see geometry)
    corridor_walls_from: auto       # depth | rgb | auto (both, more walls wins;
                                    # plain black walls give little stereo depth)
    corridor_rgb_floor_thr: 16.0    # RGB: colour/texture distance from the floor
                                    # sample (corridor_bench --floor-thr)
    corridor_rgb_min_wall_dist_m: 0.375  # RGB "wall" closer than this is a false
                                    # edge (bench: half drone width + 0.1 m)
    corridor_slice_lo_m: -0.35      # slice around camera height; anything
    corridor_slice_hi_m: 0.50       # lower than -0.35 m is passed over
    corridor_max_range_m: 5.0
    corridor_obstacle_range_m: 3.5
    corridor_obstacle_depth_m: 0.4  # obstacle = points within this behind its
                                    # nearest face: 5-10 cm boards + stereo noise
                                    # (was 0.8 for deep boxes)

    # --- green entrance banner (banner_node, OAK colour camera) ---
    # Detector/tracker values are green_detect.py's defaults (bench-tuned on
    # the banner). hold/confirm count FRAMES: the colour stream runs at 15 fps
    # here (green_detect ran at 30), so they last twice as long in time.
    banner_rate_hz: 15.0            # = OAK rgb i_fps: every frame
    banner_h_min: 40
    banner_h_max: 85
    banner_s_min: 50
    banner_v_min: 40
    banner_a_min: 15
    banner_v_floor: 30
    banner_b_min: 0                 # pale-blue test: off (blue banner: banner_blue.yaml)
    banner_min_area: 0.004
    banner_min_solidity: 0.7
    banner_min_aspect: 0.0
    banner_max_vstd: 22.0
    banner_max_edges: 0.10
    banner_max_verts: 7
    banner_allow_bottom: false
    banner_allow_top: true
    banner_gate: 0.2
    banner_hold: 10
    banner_confirm: 3
    banner_smooth: 0.5
    banner_depth_min_points: 20     # stereo points inside the banner box for a distance
    banner_debug_image: false       # true: annotated /corridor/banner/debug (tuning)

    # --- sim only ---
    sim_dropout_fraction: 0.0       # inject random invalid pixels to fake textureless walls
