# mission_params.yaml — Central configuration for Mission 2
#
# ╔═══════════════════════════════════════════════════════════════════╗
# ║  UPDATE ON COMPETITION DAY:                                       ║
# ║    - the /** survey_* block below (takeoff spot, reference QR,    ║
# ║      both corridors' wall corners), measured on site             ║
# ║    - mission_node arena_corners_lat / _lon (the arena's 4 GPS     ║
# ║      corners, in order around it). Left all zero, the full        ║
# ║      mission refuses to take off (require_arena_corners).         ║
# ║  The red mat is still found in flight. A corridor with no survey  ║
# ║  is found by its banner (green entry, blue exit) as before.       ║
# ╚═══════════════════════════════════════════════════════════════════╝
#
# Legacy / SITL only (NOT used by the full mission): path_planner_node
# origin_lat/lon, corridor1_/corridor2_waypoints_x/y and red_zone_N_x/_y
# (the old surveyed-corridor legs, fly_corridor_1/2, and the lawnmower),
# sitl_qr_simulator, sitl_corridor_sim. Local frame for those *_x / *_y
# lists: metres ENU about (origin_lat, origin_lon), x = East, y = North.
#
# FC-side settings this stack relies on (set in Mission Planner):
#   BATT_LOW_VOLT 14.0 / BATT_CRT_VOLT 13.6, BATT_FS_LOW_ACT, BATT_FS_CRT_ACT
#   FENCE_ALT_MAX 10 (companion caps every altitude at 9.5 m, mavros_utils.MAX_ALT_M;
#   arena 9.25 m), RTL_ALT 500..950 cm
#   (FC-side RTL must clear the 2.44 m corridor walls)
#   PRX1_TYPE 2, AVOID_* (obstacle_avoidance/params/stage5_6_corridor.param),
#   OA_TYPE 0 and GUID_OPTIONS 0 (plain position control in GUIDED; the
#   corridors are flown by path_planner, not BendyRuler), SERVO10_FUNCTION 0,
#   SERVO10_TRIM = winch stop PWM. RC7 is NOT used: the mission starts on launch.

# ─── Site survey (all nodes; mission_common/survey.py) ─────────────
# [lat, lon]; [0.0, 0.0] = not measured. Corridor corners are named from the
# drone's view while it flies THROUGH that corridor (entry: home -> arena,
# exit: arena -> home); mouth = where it goes in (the banner side).
# Used only when the drone takes off within survey_max_home_dist_m of
# survey_home (SITL / other sites: off). Placed on survey_home (within
# survey_max_home_shift_m): every surveyed point, the arena corners too, is
# shifted by today's home fix - survey_home (GPS error common to both).
# Centrelines are least-squares fits through all corners with the known
# width (pairs measured 3.40 / 3.55 / 2.97 m apart: GPS scatter): the mission
# log prints each corridor's length, heading and each corner's residual.
# Site survey 2026-10-30, drone placed facing the arena (heading ~296 deg):
#   entry corridor 6.94 m, heading 300 deg; exit corridor 7.25 m, 115 deg.
/**:
  ros__parameters:
    survey_home: [13.1705825, 77.5331628]       # drone's takeoff spot
    survey_qr: [13.1705922, 77.5331422]         # reference QR centre (2.5 m ahead)
    survey_entry_mouth_left: [13.1705569, 77.5331022]   # green banner side
    survey_entry_mouth_right: [13.1705868, 77.5331086]
    survey_entry_end_left: [13.1705879, 77.5330467]     # arena side
    survey_entry_end_right: [13.1706190, 77.5330538]
    survey_exit_mouth_left: [13.1706634, 77.5330672]    # blue banner, arena side
    survey_exit_mouth_right: [13.1706380, 77.5330589]
    survey_exit_end_left: [0.0, 0.0]                    # not measured: right wall + width
    survey_exit_end_right: [13.1706093, 77.5331163]     # home side
    survey_corridor_width_m: 3.5052     # 11.5 ft: rebuilds a missing / off corner
    survey_max_home_dist_m: 100.0       # takeoff further from survey_home: survey off
    survey_anchor_to_home: true
    survey_max_home_shift_m: 3.0        # placed further off survey_home: not shifted

# ─── Mission Node ─────────────────────────────────────────────────
mission_node:
  ros__parameters:
    # Altitudes (m above home). Hard cap 9.5 m everywhere (mavros_utils.MAX_ALT_M;
    # config_loader refuses a value above it):
    #   takeoff + reference QR 5 m -> corridors 1.22 m (half the 8 ft walls,
    #   never above 8 ft except the exit failsafe) -> arena 9.25 m -> drop
    #   down to 5 m and back up to 9.25 m -> exit corridor 1.22 m -> home 5 m
    drop_altitude_m: 5.0
    cruise_altitude_m: 5.0          # takeoff altitude
    # Speeds per phase (m/s):
    #   takeoff climb  takeoff_climb_rate_ms 0.5      reference QR / drop centring
    #   qr_move_speed_ms 0.5   entry corridor (clean) corridor_follow_speed_ms 0.7
    #   exit corridor (thin white obstacles) corridor_exit_speed_ms 0.4
    #   arena sweep + routing around red arena_sweep_speed_ms 0.5 (limited by
    #   what the red camera sees ahead at 9.25 m: ~3.4 m)   homing transit 2.0
    arena_speed_ms: 1.5
    transit_speed_ms: 2.0
    # Timeouts
    service_timeout_s: 10.0
    altitude_timeout_s: 30.0
    altitude_tolerance_m: 0.5
    arrival_tolerance_m: 1.5
    arrival_timeout_s: 60.0
    goto_publish_count: 20
    arm_timeout_s: 90.0
    land_timeout_s: 120.0
    corridor_timeout_s: 120.0
    entry_corridor_timeout_s: 600.0   # whole entry corridor leg (mission_node
                                      # and entry_corridor_mission): search +
                                      # approach + corridor
    lawnmower_timeout_s: 600.0
    stream_rate_hz: 10.0
    # Start gate: OFF — the mission starts as soon as it is launched (GPS,
    # sensor and EKF checks, arm, 5 s armed wait, lift off) and RC CH7 is
    # ignored entirely. true = wait for CH7 HIGH; CH7 LOW then aborts (LOITER).
    require_rc_switch: false
    rc_auto_channel: 7
    rc_auto_pwm_thresh: 1700
    # Reference QR, read in the air at cruise_altitude_m over the launch
    # point (mission_manager/reference_qr.py). Not read -> the mission
    # carries on with no target (no arena search, payload kept).
    qr_scan_attempts: 3
    qr_scan_timeout_s: 60.0
    allow_qr_fallback: false            # SITL only: fly with qr_fallback_id
    qr_fallback_id: "QR_TARGET_DEMO_ID"
    qr_initial_advance_m: 1.0           # the QR lies this far ahead of takeoff (placed
                                        # heading). No QR in view from over takeoff: fly
                                        # there (compass heading) and look again
    qr_expected_radius_m: 2.5           # only a QR within this of that spot is used:
                                        # allows GPS drift, ignores clutter further off
    qr_search_offsets_m: [0.3, -0.3, 0.6, -0.6]  # NEW: no QR in view: hover this far
                                        # forward (+) / back (-) along the nose, in order
    qr_center_tol_m: 0.3                # close enough = no move
    qr_center_passes: 4                 # locate -> move (fwd + sideways), repeated
    qr_max_radius_m: 4.0                # never further from takeoff
    qr_max_jump_m: 3.0                  # longest single correction (longer: cut to this)
    qr_move_speed_ms: 0.5
    qr_move_tolerance_m: 0.7            # GPS noise ~1 m
    qr_settle_speed_ms: 0.1             # after a move the camera looks only once
    qr_settle_hold_s: 1.0               # slower than this for this long
    qr_settle_timeout_s: 8.0            # (still moving after this: looks anyway)
    qr_locate_timeout_s: 8.0            # > qr_scanner_node locate_timeout_s
    # Gradual takeoff: arm straight away, 5 s armed wait on the ground
    # (position drift still checked), lift off to takeoff_liftoff_alt_m, slow
    # climb to cruise_altitude_m (5 m) holding the placed heading.
    takeoff_steady_time_s: 0.0      # no disarmed wait before arming
    takeoff_max_ground_drift_m: 0.8
    takeoff_liftoff_alt_m: 0.5
    takeoff_climb_rate_ms: 0.5
    # Before each banner search (entry: after the reference QR; exit: over
    # the search point): straight down to this — the middle of the 8 ft
    # corridor walls.
    corridor_start_alt_m: 1.2192
    # Phase 2 end: climb straight up to this once past the entry corridor.
    post_entry_alt_m: 9.25          # arena altitude (9-9.5 m, cap 9.5)
    # Phase 3, arena search (mission_manager/arena_search.py). COMPETITION
    # DAY: the arena's 4 GPS corners, in order around it. All zero = use
    # the arena_width_m x arena_height_m rectangle at origin_lat/lon.
    # Site survey 2026-10-30, from the drone's view facing the arena:
    # top left, top right, bottom right, bottom left (~23 x 17.5 m).
    # Shifted with the survey when anchored (/** block above).
    arena_corners_lat: [13.1705518, 13.1707511, 13.1707029, 13.1705055]
    arena_corners_lon: [77.5328589, 77.5329181, 77.5330758, 77.5330117]
    arena_alt_m: 9.25               # 9-9.5 m band (cap 9.5)
    arena_sweep_speed_ms: 0.5
    arena_red_margin_m: 2.0           # keep this far from the red mat's edge
    arena_edge_margin_m: 1.5          # strips stay this far inside the arena edge (was 1.0)
    arena_qr_size_m: 1.0              # strips spaced so a whole QR fits in the frame
    arena_match_passes: 2             # fly over the match + scan again, up to this often
    arena_match_tol_m: 1.0
    arena_rescan_timeout_s: 15.0
    require_arena_corners: true       # NEW: corners all zero -> no takeoff (full mission)
    # Mission clock (NEW), from lift-off: the arena sweep ends early so the
    # drop and the exit corridor + home + landing still fit in the limit.
    mission_time_limit_s: 900.0       # 15 min
    mission_drop_reserve_s: 90.0      # phase 4: over the QR, down, centre, release, up
    mission_exit_reserve_s: 300.0     # phase 5 + home + land (cross the arena at 0.5 m/s,
                                      # banner search, corridor, home). TUNE from SITL /
                                      # flight logs: the CLOCK lines give each phase's time
    # Phase 5, exit corridor (path_planner/exit_corridor.py): corridor 1's far
    # end mirrored across the line through the takeoff point = the exit
    # corridor's arena-side entrance (blue banner). Flown to at arena_alt_m
    # around the red zones, then down to corridor_start_alt_m facing back
    # down the corridors and a +-90 deg banner search. Not found -> shifted
    # this far sideways each way (away from corridor 1 first); then the exit
    # corridor failsafe (exit_failsafe_alt_m).
    exit_search_standoff_m: 6.0       # search this far out in the arena from it
                                      # (surveyed exit: this far in front of its mouth,
                                      # then path_planner lines up 2.5 m out)
    exit_search_shift_m: 3.0          # 0 = only the predicted point
    exit_corridor_timeout_s: 600.0    # mission_node's wait per exit corridor leg
    # EXIT CORRIDOR FAILSAFE (only there): any exit corridor failure -> climb
    # straight up to this (above the 2.44 m walls), fly home at it, land.
    # Fully autonomous; near the mouth path_planner first backs out from
    # under the banner (exit_banner_clear_m).
    exit_failsafe_alt_m: 5.0
    # Phase 4, drop (mission_manager/payload_drop.py): over the matched QR
    # at arena_alt_m, straight down to drop_altitude_m, centre on it with
    # the down camera, settle, release, straight back up to arena_alt_m.
    # Not centred / altitude not reached in time -> released anyway (GPS).
    drop_arrival_tolerance_m: 1.0
    drop_arrival_timeout_s: 30.0      # each: over the QR, the descent
    drop_settle_s: 3.0
    drop_center_tol_m: 0.3            # this close = centred, no move
    drop_center_passes: 3             # locate -> move, repeated
    drop_center_max_offset_m: 2.0     # QR further from the match = another QR: no move
    drop_release_timeout_s: 60.0      # > payload_node winch_unwind_s + winch_reel_wait_s + ~20
    # Battery (4S under load). Companion only stops the mission; the FC acts.
    battery_critical_v: 13.6
    # Obstacle sensor health (obstacle_avoidance coverage_guard)
    require_avoidance_sensor: true
    sensor_preflight_timeout_s: 30.0
    sensor_fail_timeout_s: 10.0

# ─── Path Planner ─────────────────────────────────────────────────
path_planner_node:
  ros__parameters:
    arena_width_m: 40.0
    arena_height_m: 30.0
    cruise_altitude_m: 5.0
    # Leg speeds (m/s), applied with DO_CHANGE_SPEED at the start of each leg
    transit_speed_ms: 2.0         # open-air hops (to a corridor's entry point)
    arena_speed_ms: 1.5
    origin_lat: 12.9716
    origin_lon: 77.5946
    # Downward RPi Camera Module 3: 66 deg standard, 102 deg Wide
    down_cam_hfov_deg: 66.0
    strip_overlap: 0.20           # fraction of footprint shared by adjacent strips
    goto_publish_count: 20
    # LEGACY surveyed corridor legs (fly_corridor_1/2, SITL / oa_eval only;
    # the mission finds both corridors by their banners). Only the FIRST and
    # LAST point are used: first = on the centreline 2-3 m before the mouth,
    # last = just past the exit.
    corridor1_waypoints_x: [-3.0, 13.0]
    corridor1_waypoints_y: [15.0, 15.0]
    corridor2_waypoints_x: [13.0, -3.0]
    corridor2_waypoints_y: [-5.0, -5.0]
    # LEGACY (lawnmower leg only): the mission finds the red mat in flight
    red_zone_1_x: [24.0, 36.0, 36.0, 24.0]
    red_zone_1_y: [12.0, 12.0, 22.0, 22.0]
    red_zone_2_x: [10.0, 15.0, 12.5]
    red_zone_2_y: [5.0, 5.0, 10.0]
    red_zone_3_x: [5.0, 10.0, 10.0, 7.0, 7.0, 5.0]
    red_zone_3_y: [20.0, 20.0, 22.0, 22.0, 25.0, 25.0]
    red_zone_buffer_m: 0.5
    arena_edge_margin_m: 1.0      # lawnmower stays this far inside the arena edge
    corridor_timeout_s: 120.0
    lawnmower_timeout_s: 600.0
    mavros_arrival_tolerance_m: 2.0
    # ── Corridor following (path_planner/corridor_follow.py) ──
    corridor_altitude_m: 1.2192   # middle of the 8 ft (2.4384 m) walls
    corridor_max_altitude_m: 2.4384  # climb-over ceiling = the 8 ft wall tops:
                                  # never higher inside a corridor (only the
                                  # exit failsafe climbs above them)
    corridor_follow_speed_ms: 0.7 # entry corridor (no obstacles)
    corridor_exit_speed_ms: 0.4   # exit corridor: thin white obstacles, sparse
                                  # stereo depth on their faces -> more frames each
    # Centring first (NEW): more than 0.10 m off centre, the forward step
    # shrinks linearly to min_advance of the lookahead at centre_slow_m, so
    # more of the speed goes sideways against GPS drift / wind.
    corridor_centre_slow_m: 0.30
    corridor_centre_min_advance: 0.25
    corridor_rate_hz: 5.0
    corridor_lookahead_m: 0.8
    corridor_exit_clearance_m: 1.0
    corridor_max_overrun_m: 3.0
    corridor_exit_window_m: 3.0   # a measured wall end counts only this near the surveyed end
    drone_width_m: 0.6294         # measured: 62.94 cm tip-to-tip incl. props (max)
    side_clearance_m: 0.10        # passing needs drone_width + 2 x this
    obstacle_stop_dist_m: 1.0     # wait this far from an obstacle until lined up
    obstacle_length_m: 0.10       # obstacles are white boards 5-10 cm thick (only
                                  # the face is seen); crossing behind waits
                                  # pass_margin 0.5 m more on top
    climb_clearance_m: 0.30
    body_below_camera_m: 0.15     # PLACEHOLDER: camera to lowest point (legs)
    require_corridor_perception: true   # false = GPS centreline only (SITL)
    corridor_width_m: 3.5052      # known width (11.5 ft): the GPS line's walls
    # ── GPS-anchored corridor line (corridor_follow.GpsCorridorTrack) ──
    # The corridor is flown on its GPS centreline (surveyed waypoints, or the
    # banner fix for the entry / exit corridor); walls seen by the OAK-D are
    # noisy measurements that correct it, gated against it. No walls in view
    # (most frames in an 11.5 ft corridor) = fly the GPS line, not hold.
    corridor_fuse_prior_lateral_sd_m: 0.40     # the GPS line's own uncertainty
    corridor_fuse_prior_heading_sd_deg: 3.0
    corridor_fuse_drift_sd_m_per_sqrt_s: 0.08  # GPS wander (random walk)
    corridor_fuse_wall_sd_one_m: 0.30          # larger = trust the walls less
    corridor_fuse_wall_sd_two_m: 0.20
    corridor_fuse_heading_sd_one_deg: 6.0
    corridor_fuse_heading_sd_two_deg: 4.0
    corridor_fuse_gate_sigma: 3.0              # wall reading this many SDs off: ignored
    corridor_fuse_max_correction_m: 1.0        # walls never move the line further
    corridor_fuse_max_heading_dev_deg: 10.0
    corridor_fuse_banner_lateral_sd_m: 1.0     # entry/exit: the banner fix's position
    corridor_fuse_banner_max_correction_m: 2.0 # (SITL ~0.8 m off + GPS drift since)
    corridor_fuse_banner_heading_sd_deg: 10.0  # entry/exit: the banner fix's direction
    corridor_fuse_banner_max_heading_dev_deg: 25.0  # is poor (SITL 21 deg off); the line
                                               # pivots under the banner, walls turn it
    corridor_fuse_width_tol_m: 0.30            # wall pair this far off the width: ignored
    corridor_nominal_length_m: 6.7056  # 22 ft: entry/exit corridor ends here (+ exit
                                  # clearance) when no wall end is measured
    corridor_perception_stale_s: 1.0  # obstacle legs: no perception this long = hold
    exit_banner_clear_m: 1.0      # exit corridor failure this near the mouth: back
                                  # out from under the banner before the climb
    # Exit corridor obstacles (NEW): passed beside only with this much air each
    # side; less (a centred 3.5 ft obstacle leaves 0.29 m) -> flown OVER it
    # (top + body_below_camera_m + climb_clearance_m, <= corridor_max_altitude_m).
    # Can't be climbed (too tall / too near the banner) -> beside at side_clearance_m.
    exit_pass_side_clearance_m: 0.40
    body_above_camera_m: 0.20     # PLACEHOLDER — MEASURE: camera to the drone's top
                                  # (props / GPS mast). Under the banner the altitude
                                  # stays <= banner bottom - this - climb_clearance_m
    banner_climb_after_m: 0.7     # no climb until this far past the mouth (half the
                                  # drone's length + GPS error)
    # ── Surveyed corridors (the /** survey block): no banner search ──
    # To entry_preentry_m in front of the surveyed mouth, down to half the
    # banner height, look survey_banner_wait_s. Banner seen: its centre moves
    # the line sideways (weighted by the two SDs, <= max_shift), its bottom
    # edge sets the altitude. NOT seen: in on the surveyed line anyway.
    survey_banner_wait_s: 4.0
    survey_banner_min_frames: 3
    survey_banner_max_shift_m: 1.5
    survey_lateral_sd_m: 0.7      # surveyed line vs today's GPS
    survey_banner_sd_m: 0.3       # banner bearing from 2.5 m
    survey_max_correction_m: 1.5  # walls move the line at most this
    survey_banner_bottom_m: 2.4384  # not measured: banner on the 8 ft walls
    corridor_end_visible_m: 3.5   # no set length (fly_corridor_here, entry): a
                                  # measured wall end this near must stay in
                                  # view, else the walls go on and it is dropped
    # ── Entry corridor, end of phase 1 (/path_planner/entry_corridor, entry_corridor.py) ──
    # Find the green banner, read from its shape where the entrance is and
    # which way the corridor runs, fly to a point straight out in front of
    # it, line up on the walls under it, fly through at half the banner's
    # bottom-edge height. Width, length and altitude are measured, not set.
    entry_search_alt_min_m: 1.0   # banner not seen: sweep at the current
    entry_search_alt_max_m: 2.4   # altitude, then at these, nearest first (<= 8 ft)
    entry_search_alt_step_m: 0.5
    entry_search_yaw_rate_deg_s: 20.0
    entry_search_half_angle_deg: 90.0  # NEW: sweep this far each side of the
                                  # placed heading, left first (>= 180: full turns)
    entry_min_elev_deg: 5.0       # get below the banner (bottom edge this far
                                  # above the horizon) before moving toward it
    entry_descend_step_m: 0.3
    entry_standoff_m: 2.0         # no closer until its height is measured
    entry_height_samples: 5       # banner frames before estimating its height
    entry_height_tol_m: 0.10      # NEW: that estimate's standard error before
                                  # trusting it (then the banner is "fixed")
    entry_preentry_m: 2.5         # NEW: line-up point this far straight out in
                                  # front of the entrance (3 m puts an 11.5 ft
                                  # corridor's walls at the edge of the depth range)
    entry_min_altitude_m: 0.5     # floor on half the banner height
    entry_lineup_settle_s: 2.0    # at the line-up point before going in (walls
                                  # seen meanwhile correct the banner's line)
    entry_max_backoff_m: 3.0      # backing off to see the banner again
    entry_approach_timeout_s: 90.0
    entry_research_after_s: 5.0   # NEW: banner lost this long before it is fixed:
                                  # sweep +-half angle again around where it was
    # Obstacle sensor gating (hold / back off / fail)
    require_avoidance_sensor: true
    sensor_fail_timeout_s: 10.0
    coverage_backoff_after_s: 3.0
    coverage_backoff_m: 1.0

# ─── Payload Node ─────────────────────────────────────────────────
payload_node:
  ros__parameters:
    # Winch: the payload hangs on a thread on a motor spool and is heavy
    # enough to unwind it, so the motor reels in at full speed from node
    # start. Release = stop for winch_unwind_s (the payload drops), then
    # full speed again and winch_reel_wait_s held before climbing.
    # Landed (disarmed after flying above 1 m) -> stop; armed again -> spin.
    # BENCH-CHECK: spin must reel IN (else use the other end, 1000), stop
    # must leave the spool free; SERVO10_TRIM = winch_pwm_stop.
    release_channel: 10
    winch_pwm_spin: 2000
    winch_pwm_stop: 1500
    winch_unwind_s: 8.0               # time it for the full thread on the bench
    winch_reel_wait_s: 5.0

# ─── Corridor ground markers (qr_detection ground_marker_node) ───
# Downward camera: green = corridor entrance, blue = exit. HSV in OpenCV
# units [h_lo, h_hi, s_min, v_min] (h 0..179). TUNE ON SITE: hover over each
# marking and over the grass, read the logged fractions; grass must stay well
# under marker_min_fraction.
ground_marker_node:
  ros__parameters:
    marker_rate_hz: 10.0
    marker_min_fraction: 0.20
    marker_gate_frames: 3
    green_hsv: [40, 85, 120, 60]
    blue_hsv: [95, 130, 120, 50]

# ─── SITL QR Simulator ───────────────────────────────────────────
sitl_qr_simulator:
  ros__parameters:
    qr_location_lat: 12.9717
    qr_location_lon: 77.5947
    qr_content: "QR_TARGET_DEMO_ID"
    detection_radius_m: 10.0

# ─── SITL corridor simulator (obstacle_avoidance, SITL only) ──────
# Corridor waypoints and origin MUST match path_planner_node above.
# Obstacles: [s_from_mouth, lateral_centre(+left), width, top_height, ...]
sitl_corridor_sim:
  ros__parameters:
    origin_lat: 12.9716
    origin_lon: 77.5946
    corridor1_waypoints_x: [-3.0, 13.0]
    corridor1_waypoints_y: [15.0, 15.0]
    corridor2_waypoints_x: [13.0, -3.0]
    corridor2_waypoints_y: [-5.0, -5.0]
    corridor1_obstacles: [0.0]          # clean
    # Corridor 2 = the exit corridor (s from its arena-side mouth): three
    # 3.5 ft wide x 6 ft tall obstacles (1.07 x 1.83 m) — in the middle, then
    # near the left wall, then near the right wall. Real positions are
    # random; they are boards 5-10 cm thick (sitl_corridor_sim obstacle_depth_m
    # 0.1; the planner assumes obstacle_length_m 0.10).
    corridor2_obstacles: [1.5, 0.0, 1.0668, 1.8288,
                          3.6, 1.1, 1.0668, 1.8288,
                          5.6, -1.1, 1.0668, 1.8288]
    corridor_width_m: 1.524
    wall_height_m: 4.0
    # Corridor 1 = the entry corridor, competition size (11.5 ft wide, 8 ft
    # walls, 22 ft long). The flight code measures all three; set your test
    # rig's size here to rehearse it. 0 = the shared values above / length
    # from the waypoints.
    corridor1_width_m: 3.5052
    corridor1_wall_height_m: 2.4384
    corridor1_length_m: 6.7056
    # Corridor 2 = the exit corridor, the same size (blue banner on it).
    corridor2_width_m: 3.5052
    corridor2_wall_height_m: 2.4384
    corridor2_length_m: 6.7056
    # Banners (colour stream only, no stereo depth): 11.5 x 1.5 ft, centred
    # on top of the mouth — green on corridor 1, blue on corridor 2
    banner_width_m: 3.5052
    banner_height_m: 0.4572
    banner_above_walls_m: 0.0           # 0 = sitting on the corridor's walls
    mouth_offset_m: 2.5
    exit_offset_m: 1.0
    gps_offset_m: 0.5                   # EKF vs truth: GPS-only flight would scrape a wall

# ─── Red-zone node (qr_detection), same downward Cam3 ──────────────
red_zone_node:
  ros__parameters:
    cam_mirror: true              # as qr_scanner_node.cam_mirror

# ─── QR Scanner Node (qr_detection) ────────────────────────────────
qr_scanner_node:
  ros__parameters:
    gate_required: 3
    min_confidence: 0.5
    delivery_altitude: 5.0        # fallback only; rel_alt is used when available
    scan_timeout_s: 60.0
    cam_yaw_offset_deg: 0.0       # image top -> nose; rotate if mounted otherwise
    cam_mirror: true              # Cam3 image mirrored left-right vs the real scene
                                  # (as mounted): every frame is flipped back first
    # The "QRs" are NOT QR codes but AprilTags 36h11 (the sample seen: id 2),
    # 1 m a side: known by their decoded ID; one that does not decode is
    # found by its size at the current height and matched by picture.
    marker_size_m: 1.0
    tag_dict: DICT_APRILTAG_36h11     # "" = picture only
    # Picture match (fallback): correlation two looks must reach (SITL: same
    # marker >= 0.84, different <= 0.73). TUNE with real prints if possible.
    match_min_similarity: 0.78
    # Camera intrinsics (camera_fx also sets the marker size looked for) — RPi Camera Module 3 at 1280x720 (approximate).
    # Overridden by /camera_info when camera_ros publishes a calibration.
    # To calibrate: ros2 run camera_calibration cameracalibrator
    #   --size 8x6 --square 0.025 image:=/down_frame
    camera_fx: 920.0
    camera_fy: 920.0
    camera_cx: 640.0
    camera_cy: 360.0
